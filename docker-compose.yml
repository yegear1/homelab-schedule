services:
  homelab-schedule:
    build: .
    image: ghcr.io/yegear1/homelab-schedule:${HOMELAB_SCHEDULE_VERSION:-latest}
    container_name: homelab-schedule
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LOG_FORMAT: json
      NO_COLOR: "1"
      ENV: ${ENV:-production}
      ENVIRONMENT: ${ENV:-production}
      SERVICE_NAME: homelab-schedule
      APP: homelab-schedule
      TZ: America/Sao_Paulo
      DATABASE_PATH: /data/schedule.sqlite
      ROUTINES_PATH: /app/routines.yaml
      APP_PORT: "8003"
    ports:
      - "8003:8003"
    volumes:
      - schedule-data:/data
      - ./routines.yaml:/app/routines.yaml:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8003/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M

volumes:
  schedule-data:
